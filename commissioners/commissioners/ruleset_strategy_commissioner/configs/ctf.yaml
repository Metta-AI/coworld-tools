schedule_interval_minutes: 5

scoring:
  round_score: win
  leaderboard:
    type: ewma
    half_life_hours: 2

# The adaptive window needs a game timeout it can parse, but bitworld-family
# game configs spell it camelCase (maxTicks) with an implicit 24 ticks/sec, so
# _configured_episode_timeout_seconds resolves None and the throttle pins at
# min_in_flight. CTF games run ~5.5 min realtime (maxTicks 10000 / 24); the
# floor below IS the effective concurrency — sized so a 110-episode round
# finishes in ~40 min instead of ~2.5 h (the 16 parallel crash-check rounds on
# 2026-07-10 showed the cluster absorbs this comfortably).
dispatch_throttle:
  enabled: true
  min_in_flight: 16
  max_in_flight: 50
  startup_buffer_seconds: 30
  target_load: 0.75
  worker_seconds_per_episode: 45

defaults:
  # CTF assigns teams by slot parity (even = Red, odd = Blue), so entrant
  # policies must be seated interleaved. Contiguous team_blocks seating put 4
  # agents of every policy on each team, which made every episode a scored tie.
  seating: team_interleaved
  # The current board leader's agents wear the crown skin (cosmetic only —
  # the game ignores unknown/invalid skin values, so this is safe to ship
  # ahead of or behind the game image that renders it).
  leader_slot_config:
    skin: crown
  team_count: 2
  fill_seats: strict
  min_entries_to_start: 2
  stage:
    label: CTF round
    episodes: 2
    # Adaptive budgets: settled entrants play the floor, new/moving entrants up
    # to the ceiling. Rounds shrink from ~5x to ~2-3x the field size, so at the
    # 5-minute schedule slot each round completes (and feeds the 2h-EWMA board)
    # roughly twice as often — movers settle faster while flat veterans stop
    # burning episodes that can't move their score.
    min_episodes_per_entrant: 4
    max_episodes_per_entrant: 16
  adaptive:
    enabled: true
    settle_rounds: 6
    volatility_rounds: 6
    volatility_scale: 0.15
    trend_scale: 0.10
    max_round_episodes: 160

divisions:
  qualifiers:
    name: Qualifiers
    level: -99
    match:
      name: Qualifiers
      type: staging
    entrants: qualifying
    min_entries_to_start: 1
    stages:
      - id: crash_check
        schedule:
          label: Crash check
          self_play: true
          attempts: 2
          min_episodes_per_entrant: 2
        on_round_complete:
          - id: qualified
            criteria:
              completed_episodes_gt: 0
            actions:
              - type: update_membership
                division: competition
                status: competing
                substatus: champion
          - id: disqualified
            criteria: otherwise
            actions:
              - type: update_membership
                status: disqualified
                substatus: inactive

  competition:
    name: Competition
    previous_name: Daily
    level: 1
    match:
      type: competition
    # One champion per player: benched older versions must not eat round
    # seats — they go objective-blind after every game update and become
    # free-win farms that distort the whole board. (The old all-competing
    # selector predates the league having more than one real player.)
    entrants: champions
    # Seating guard (round start, works even while rounds keep failing): an
    # entrant with 3+ recent completed-round results, all zero while someone
    # else scored, is not seated at all. The membership-event rules below
    # formally disqualify it once a round completes.
    bench_scoreless_after: 3
    # Kick lifeless entrants: qualification is a one-time crash check, but the
    # game keeps updating underneath the field — a policy that qualified three
    # versions ago can rot into a crash-on-connect corpse that forfeits every
    # episode in seconds (daf-flagrunner:v3 was 0.0000 over 190 rounds of
    # 1-tick games). A policy that has >= sustained_rounds recent rounds on
    # record and never scored above zero in ANY of them is not competing —
    # disqualify it. A single scoring round anywhere in the recent window
    # protects a live-but-struggling bot (and everyone during a game-update
    # blind spell earns points off the truly dead, so live bots never sustain
    # an all-zero window). Re-uploading a fixed version re-qualifies fresh.
    on_round_complete:
      # A container that completes ZERO of its scheduled episodes in a round
      # is broken outright (crash-on-start resubmissions sail through the
      # self-play crash check but fail every competition episode, and ten
      # failed episodes per round take the whole ROUND down with them).
      # One completed round of nothing-but-failures is enough evidence —
      # resubmitting a fixed version re-qualifies through the normal check.
      - id: broken
        criteria:
          completed_episodes_lte: 0
        actions:
          - type: update_membership
            status: disqualified
            substatus: broken
            reason: >-
              Completed zero episodes in a round — container presumed
              broken; resubmit a fixed version to re-qualify.
      - id: lifeless
        criteria:
          score_lte: 0.0
          sustained_rounds: 10
        actions:
          - type: update_membership
            status: disqualified
            substatus: lifeless
            reason: >-
              Zero score in every recent round on record (10+ rounds) —
              presumed broken; resubmit a fixed version to re-qualify.
