schedule_interval_minutes: 30

scoring:
  round_score: win
  leaderboard:
    type: ewma
    half_life_hours: 2

dispatch_throttle:
  enabled: true
  min_in_flight: 4
  max_in_flight: 50
  startup_buffer_seconds: 30
  target_load: 0.75
  worker_seconds_per_episode: 45

defaults:
  # CTF assigns teams by slot parity (even = Red, odd = Blue), so entrant
  # policies must be seated interleaved. Contiguous team_blocks seating put 4
  # agents of every policy on each team, which made every episode a scored tie.
  seating: team_interleaved
  team_count: 2
  fill_seats: strict
  min_entries_to_start: 2
  stage:
    label: CTF round
    episodes: 2
    min_episodes_per_entrant: 10

divisions:
  qualifiers:
    name: Qualifiers
    level: -99
    match:
      name: Qualifiers
      type: staging
    entrants: qualifying
    min_entries_to_start: 1
    stages:
      - id: crash_check
        schedule:
          label: Crash check
          self_play: true
          attempts: 2
          min_episodes_per_entrant: 2
        on_round_complete:
          - id: qualified
            criteria:
              completed_episodes_gt: 0
            actions:
              - type: update_membership
                division: competition
                status: competing
                substatus: champion
          - id: disqualified
            criteria: otherwise
            actions:
              - type: update_membership
                status: disqualified
                substatus: inactive

  competition:
    name: Competition
    previous_name: Daily
    level: 1
    match:
      type: competition
    # All competing policies play, not one champion per account: the platform
    # allows a single is_champion membership per player, so a league seeded
    # with many baselines from one account would otherwise never reach
    # min_entries_to_start.
    entrants:
      status: competing
