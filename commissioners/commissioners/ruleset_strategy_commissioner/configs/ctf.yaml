schedule_interval_minutes: 30

scoring:
  round_score: win
  leaderboard:
    type: ewma
    half_life_hours: 2

# The adaptive window needs a game timeout it can parse, but bitworld-family
# game configs spell it camelCase (maxTicks) with an implicit 24 ticks/sec, so
# _configured_episode_timeout_seconds resolves None and the throttle pins at
# min_in_flight. CTF games run ~5.5 min realtime (maxTicks 10000 / 24); the
# floor below IS the effective concurrency — sized so a 110-episode round
# finishes in ~40 min instead of ~2.5 h (the 16 parallel crash-check rounds on
# 2026-07-10 showed the cluster absorbs this comfortably).
dispatch_throttle:
  enabled: true
  min_in_flight: 16
  max_in_flight: 50
  startup_buffer_seconds: 30
  target_load: 0.75
  worker_seconds_per_episode: 45

defaults:
  # Every episode seats up to 16 DISTINCT entrant policies, shuffled across the
  # seats: CTF derives teams from slot parity (even = Red, odd = Blue), so the
  # shuffle gives each policy a random side and random teammates every episode.
  # team_interleaved before this seated only TWO entrants per episode (8 copies
  # each) with a deterministic round-robin pairing.
  seating: shuffled_seats
  fill_seats: strict
  min_entries_to_start: 2
  stage:
    label: CTF round
    episodes: 2
    min_episodes_per_entrant: 10

divisions:
  qualifiers:
    name: Qualifiers
    level: -99
    match:
      name: Qualifiers
      type: staging
    entrants: qualifying
    min_entries_to_start: 1
    stages:
      - id: crash_check
        schedule:
          label: Crash check
          self_play: true
          attempts: 2
          min_episodes_per_entrant: 2
        on_round_complete:
          - id: qualified
            criteria:
              completed_episodes_gt: 0
            actions:
              - type: update_membership
                division: competition
                status: competing
                substatus: champion
          - id: disqualified
            criteria: otherwise
            actions:
              - type: update_membership
                status: disqualified
                substatus: inactive

  competition:
    name: Competition
    previous_name: Daily
    level: 1
    match:
      type: competition
    # All competing policies play, not one champion per account: the platform
    # allows a single is_champion membership per player, so a league seeded
    # with many baselines from one account would otherwise never reach
    # min_entries_to_start.
    entrants:
      status: competing
