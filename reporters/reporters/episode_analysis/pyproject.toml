[project]
name = "episode-analysis"
version = "0.1.0"
description = "Game-agnostic episode analysis + visualization primitives for reporter/diagnoser authors: MettaScope replay decoding, canonical (ts,player,key,value) event-log queries, heatmaps, paired A/B stats, optimal-tour routing, dependency-free PNG drawing, and (via the [charts] extra) matplotlib chart builders."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2",
    "pyarrow>=18,<25",
]

[project.optional-dependencies]
charts = [
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["episode_analysis"]
