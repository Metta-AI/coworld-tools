[project]
name = "crewrift-analysis"
version = "0.1.0"
description = "CrewRift-specific analysis and figures over expand_replay JSONL: a typed episode adapter, the 16-color player palette, imposter/crew contrast metrics, and four figures (contrast table, vote ladder, missed-blend overlay, fog of war) composed from episode-analysis primitives."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "episode-analysis",
    "numpy>=2",
]

[project.optional-dependencies]
charts = [
    "episode-analysis[charts]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crewrift_analysis"]

[tool.uv.sources]
episode-analysis = { workspace = true }
